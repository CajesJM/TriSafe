  <circle cx="76" cy="166" r="27" fill="#0F5C50" stroke="white" stroke-width="10"/>
  <circle cx="190" cy="166" r="27" fill="#0F5C50" stroke="white" stroke-width="10"/>
  <circle cx="76" cy="166" r="7" fill="#F3B33D"/>
  <circle cx="190" cy="166" r="7" fill="#F3B33D"/>

