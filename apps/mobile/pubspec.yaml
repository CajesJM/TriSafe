name: trisafe_mobile
description: TriSafe passenger and driver mobile app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  mobile_scanner: ^6.0.2
  share_plus: ^10.1.4
  geolocator: ^13.0.2
  url_launcher: ^6.3.2
  flutter_map: 8.3.1
  latlong2: 0.9.1
  qr_flutter: 4.1.0
  image_picker: ^1.1.2
  google_maps_flutter: ^2.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
